name: Generate TeX PDFs

on:
  push:
    branches:
      - main
    paths:
      - public/cv.tex
      - public/resume.tex
      - scripts/build-tex-pdfs.sh
      - .github/workflows/generate-pdfs.yml

permissions:
  contents: write

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Generate PDFs
        run: npm run build:pdfs

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/generated-pdfs/cv.pdf public/generated-pdfs/resume.pdf
          if git diff --cached --quiet; then
            echo "Generated PDFs are already current."
          else
            git commit -m "Update generated PDFs"
            git push
          fi
